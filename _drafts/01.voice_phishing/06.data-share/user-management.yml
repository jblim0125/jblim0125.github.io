  # 감사 및 모니터링 API
  /audit/events:
    get:
      summary: 감사 이벤트 조회
      parameters:
        - name: userId
          in: query
          schema:
            type: string
          description: 특정 사용자의 이벤트만 조회
        - name: type
          in: query
          schema:
            type: string
            enum:
              [
                LOGIN,
                LOGOUT,
                REGISTER,
                UPDATE_PROFILE,
                UPDATE_PASSWORD,
                SEND_RESET_PASSWORD,
                UPDATE_TOTP,
                REMOVE_TOTP,
                VERIFY_EMAIL,
                SEND_VERIFY_EMAIL,
                SEND_IDENTITY_PROVIDER_LINK,
                SEND_IDENTITY_PROVIDER_LINK_ERROR,
                RESET_PASSWORD,
                RESET_PASSWORD_ERROR,
                IDENTITY_PROVIDER_LINK_ACCOUNT,
                IDENTITY_PROVIDER_LINK_ACCOUNT_ERROR,
                UPDATE_CONSENT,
                UPDATE_CONSENT_ERROR,
                REVOKE_GRANT,
                REVOKE_GRANT_ERROR,
                LOGIN_ERROR,
                REGISTER_ERROR,
                LOGOUT_ERROR,
                UPDATE_PROFILE_ERROR,
                UPDATE_PASSWORD_ERROR,
                CUSTOM_REQUIRED_ACTION,
                CUSTOM_REQUIRED_ACTION_ERROR,
                EXECUTE_ACTIONS,
                EXECUTE_ACTIONS_ERROR,
                EXECUTE_ACTION_TOKEN,
                EXECUTE_ACTION_TOKEN_ERROR,
                CLIENT_LOGIN,
                CLIENT_LOGIN_ERROR,
                RESTART_AUTHENTICATION,
                RESTART_AUTHENTICATION_ERROR,
                INVALIDATE_ALL_SESSIONS,
                IDENTITY_PROVIDER_POST_LOGIN,
                IDENTITY_PROVIDER_POST_LOGIN_ERROR,
                IMPERSONATE,
                IMPERSONATE_ERROR,
                DELETE_ACCOUNT,
                DELETE_ACCOUNT_ERROR,
                UPDATE_EMAIL,
                UPDATE_EMAIL_ERROR,
              ]
          description: 이벤트 타입 필터
        - name: fromDate
          in: query
          schema:
            type: string
            format: date-time
          description: 시작 날짜
        - name: toDate
          in: query
          schema:
            type: string
            format: date-time
          description: 종료 날짜
        - name: first
          in: query
          schema:
            type: integer
            default: 0
        - name: max
          in: query
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: 감사 이벤트 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    time:
                      type: integer
                      format: int64
                    type:
                      type: string
                    realmId:
                      type: string
                    clientId:
                      type: string
                    userId:
                      type: string
                    sessionId:
                      type: string
                    ipAddress:
                      type: string
                    error:
                      type: string
                    details:
                      type: object

  /statistics/users:
    get:
      summary: 사용자 통계 정보
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [day, week, month, year]
            default: month
          description: 통계 기간
      responses:
        "200":
          description: 사용자 통계
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalUsers:
                    type: integer
                  activeUsers:
                    type: integer
                  newUsers:
                    type: integer
                  loginCount:
                    type: integer
                  groupDistribution:
                    type: object
                    additionalProperties:
                      type: integer

  # 대량 작업 API
  /bulk/users/import:
    post:
      summary: 사용자 대량 가져오기
      description: CSV 또는 JSON 파일을 통한 사용자 대량 가져오기
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 사용자 데이터 파일 (CSV 또는 JSON)
                skipIfExists:
                  type: boolean
                  default: true
                  description: 이미 존재하는 사용자 건너뛰기
      responses:
        "200":
          description: 가져오기 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalProcessed:
                    type: integer
                  successCount:
                    type: integer
                  failureCount:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        line:
                          type: integer
                        error:
                          type: string
                        data:
                          type: object

  /bulk/users/export:
    get:
      summary: 사용자 대량 내보내기
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, json]
            default: csv
        - name: groupId
          in: query
          schema:
            type: string
          description: 특정 그룹의 사용자만 내보내기
      responses:
        "200":
          description: 사용자 데이터 파일
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
