openapi: "3.0.3"
info:
  title: Voice Phishing Data Upload API
  description: API for uploading files with metadata using multipart/form-data
  version: "1.0"
servers:
  - url: http://192.168.105.51:8080/api/v1/collector
    description: development server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Metadata:
      type: object
      required:
        - dataType
        - receivedTime
        - senderNumber
        - receiverNumber
        - content
        - carrier
      properties:
        dataType:
          type: string
          enum: [audio, image, message]
          description: 데이터 타입 (음성, 텍스트, 이미지)
        receivedTime:
          type: string
          format: date-time
          description: 수신시간 (ISO 8601 형식)
          example: "2025-07-04T10:30:00Z"
        senderNumber:
          type: string
          description: 보낸번호
          example: "010-xxxx-xxxx"
        receiverNumber:
          type: string
          description: 받은번호
          example: "010-xxxx-xxxx"
        replyNumber:
          type: string
          pattern: "^[0-9-+]+$"
          description: 회신번호
          example: "010-5555-1234"
        content:
          type: string
          description: 내용
          maxLength: 1000
        carrier:
          type: string
          enum: [SKT, KT, LGU+, MVNO]
          description: 통신사

    commonResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 업로드 성공 여부
        message:
          type: string
          description: 생성된 메시지 ID
        data:
          type: object
          description: 응답 데이터

security:
  - BearerAuth: []

paths:
  /upload:
    post:
      summary: Upload metadata with files
      description: |
        multipart/form-data를 이용하여 메타데이터와 파일을 함께 업로드합니다.
        인증된 사용자만 접근 가능합니다.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - metadata
              properties:
                metadata:
                  description: JSON 형태의 메타데이터
                  allOf:
                    - $ref: "#/components/schemas/Metadata"
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: 업로드할 파일들 (음성, 텍스트, 이미지)
                  maxItems: 10
            encoding:
              metadata:
                contentType: application/json
              files:
                contentType: |
                  audio/mpeg, audio/wav, audio/ogg, audio/mp3, audio/m4a,
                  text/plain, text/csv, application/json,
                  image/jpeg, image/png, image/gif, image/webp
      responses:
        "200":
          description: 업로드 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/commonResponse"
              example:
                success: true
                message: "VoicePhishing Data Upload Successfully"

        "400":
          description: 잘못된 요청 (필수 필드 누락, 파일 형식 오류 등)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/commonResponse"
              examples:
                missing_metadata:
                  summary: 메타데이터 누락
                  value:
                    success: false
                    message: "metadata field is required"
                invalid_file_type:
                  summary: 지원하지 않는 파일 형식
                  value:
                    success: false
                    message: "Unsupported file type. Allowed types: audio/*, text/*, image/*"
                file_too_large:
                  summary: 파일 크기 초과
                  value:
                    error: "Bad Request"
                    message: "File size exceeds maximum limit (10MB)"

        "401":
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/commonResponse"
              example:
                success: false
                message: "Invalid or missing authentication token"

        "403":
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/commonResponse"
              example:
                success: false
                message: "Insufficient permissions to upload files"

        "413":
          description: 페이로드 크기 초과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/commonResponse"
              example:
                success: false
                message: "Payload Too Large"

        "429":
          description: 요청 제한 초과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/commonResponse"
              example:
                success: false
                message: "Upload rate limit exceeded. Try again later."
                code: 429

        "500":
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/commonResponse"
              example:
                success: false
                message: "Internal Server Error"
