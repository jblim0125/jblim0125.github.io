# 보이스 피싱 데이터 공유 API 문서
# 이 문서는 데이터 셋을 만들고 다이내믹 path를 사용하여 데이터 셋 공유 API를 정의합니다.
# API에 대한 접근 제어에 대한 자세한 내용은 access-control.yml 파일에서 정의됩니다.
# 이 문서에서는 접근 제어 일부 기능이 포함되어 있습니다.
openapi: "3.0.3"
info:
  title: Voice Phishing Data Share API
  description: Voice Phishing Data(Dataset) 공유 API
  version: "1.0.0"
servers:
  - url: http://192.168.105.51:8080/api/v1/dataset
    description: development server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    VoicePhishingData:
      type: object
      properties:
        id:
          type: string
          description: 데이터 고유 식별자
        dataType:
          type: string
          enum: [VOICE, IMAGE, TEXT]
          description: 데이터 타입
        timestamp:
          type: string
          format: date-time
          description: 데이터 수집 시간
        senderNumber:
          type: string
          description: "보낸번호 (마스킹됨: 010-****-****)"
        receiverNumber:
          type: string
          description: "받은번호 (마스킹됨: 010-****-****)"
        callbackNumber:
          type: string
          description: "회신번호 (예: 010-1234-1234)"
        content:
          type: string
          description: 텍스트 내용 또는 음성 전사 내용
        receiverCarrier:
          type: string
          enum: [SKT, KT, LGU, MVNO]
          description: 수신자 통신사
        fileInfo:
          $ref: "#/components/schemas/FileInfo"
        metadata:
          type: object
          additionalProperties: true
          description: 추가 메타데이터
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FileInfo:
      type: object
      properties:
        fileName:
          type: string
          description: 파일명
        fileFormat:
          type: string
          description: "파일 포맷 (예: mp3, wav, jpg, png, txt)"
        fileSize:
          type: integer
          format: int64
          description: 파일 크기 (bytes)
        duration:
          type: number
          format: float
          description: 재생시간 (초, 음성/영상 파일의 경우)
        resolution:
          type: string
          description: "해상도 (이미지/영상의 경우, 예: 1920x1080)"
        bitrate:
          type: integer
          description: 비트레이트 (음성/영상 파일의 경우)
        encoding:
          type: string
          description: "인코딩 방식 (예: UTF-8, PCM)"
        checksum:
          type: string
          description: 파일 체크섬 (무결성 검증용)

    DataSearchFilter:
      type: object
      properties:
        dataTypes:
          type: array
          items:
            type: string
            enum: [VOICE, IMAGE, TEXT]
          description: 검색할 데이터 타입
        startDate:
          type: string
          format: date-time
          description: 시작 날짜
        endDate:
          type: string
          format: date-time
          description: 종료 날짜
        senderNumberPattern:
          type: string
          description: "보낸번호 패턴 (예: 010-1234-*)"
        receiverNumberPattern:
          type: string
          description: "받은번호 패턴 (예: 010-5678-*)"
        callbackNumber:
          type: string
          description: 회신번호 정확 매치
        contentKeywords:
          type: array
          items:
            type: string
          description: 내용 검색 키워드
        receiverCarriers:
          type: array
          items:
            type: string
            enum: [SKT, KT, LGU, MVNO]
          description: 수신자 통신사
        fileFormats:
          type: array
          items:
            type: string
          description: 파일 포맷 필터
        minFileSize:
          type: integer
          format: int64
          description: 최소 파일 크기 (bytes)
        maxFileSize:
          type: integer
          format: int64
          description: 최대 파일 크기 (bytes)
        minDuration:
          type: number
          format: float
          description: 최소 재생시간 (초)
        maxDuration:
          type: number
          format: float
          description: 최대 재생시간 (초)
        tags:
          type: array
          items:
            type: string
          description: 태그 필터
        excludeIds:
          type: array
          items:
            type: string
          description: 제외할 데이터 ID 목록

    Dataset:
      type: object
      properties:
        id:
          type: string
          description: 데이터셋 고유 식별자
        name:
          type: string
          description: 데이터셋 이름
        description:
          type: string
          description: 데이터셋 설명
        filter:
          $ref: "#/components/schemas/DataSearchFilter"
        totalCount:
          type: integer
          description: 데이터셋에 포함된 총 데이터 수
        size:
          type: integer
          format: int64
          description: 데이터셋 총 크기 (bytes)
        status:
          type: string
          enum: [CREATING, READY, EXPIRED, ERROR]
          description: 데이터셋 상태
        accessSettings:
          $ref: "#/components/schemas/DatasetAccessSettings"
        shareUrl:
          type: string
          description: 데이터셋 공유 URL
        expiresAt:
          type: string
          format: date-time
          description: 만료 시간
        createdBy:
          type: string
          description: 생성자 사용자 ID
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DatasetCreate:
      type: object
      required:
        - name
        - filter
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: 데이터셋 이름
        description:
          type: string
          maxLength: 500
          description: 데이터셋 설명
        filter:
          $ref: "#/components/schemas/DataSearchFilter"
        accessSettings:
          $ref: "#/components/schemas/DatasetAccessSettings"
        expirationDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 30
          description: 만료 일수

    DatasetUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        accessSettings:
          $ref: "#/components/schemas/DatasetAccessSettings"
        expirationDays:
          type: integer
          minimum: 1
          maximum: 365

    DatasetAccessSettings:
      type: object
      properties:
        isPublic:
          type: boolean
          default: false
          description: 공개 데이터셋 여부
        allowedUsers:
          type: array
          items:
            type: string
          description: 접근 허용 사용자 ID 목록
        allowedGroups:
          type: array
          items:
            type: string
          description: 접근 허용 그룹 ID 목록
        allowedRoles:
          type: array
          items:
            type: string
          description: 접근 허용 역할 목록
        requiredAttributes:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: string
          description: 필수 속성 조건
        downloadLimit:
          type: integer
          description: 다운로드 횟수 제한
        accessLimit:
          type: integer
          description: 접근 횟수 제한

    DatasetShare:
      type: object
      properties:
        id:
          type: string
          description: 공유 링크 ID
        datasetId:
          type: string
          description: 데이터셋 ID
        shareToken:
          type: string
          description: 공유 토큰
        shareUrl:
          type: string
          description: 공유 URL
        accessCount:
          type: integer
          description: 접근 횟수
        downloadCount:
          type: integer
          description: 다운로드 횟수
        lastAccessed:
          type: string
          format: date-time
          description: 마지막 접근 시간
        expiresAt:
          type: string
          format: date-time
          description: 공유 링크 만료 시간
        isActive:
          type: boolean
          description: 활성화 상태
        createdAt:
          type: string
          format: date-time

    DataPreview:
      type: object
      properties:
        totalCount:
          type: integer
          description: 검색 조건에 매칭되는 총 데이터 수
        estimatedSize:
          type: integer
          format: int64
          description: 예상 데이터셋 크기 (bytes)
        sampleData:
          type: array
          items:
            $ref: "#/components/schemas/VoicePhishingData"
          description: 샘플 데이터 (최대 10개)
        dataTypeDistribution:
          type: object
          additionalProperties:
            type: integer
          description: 데이터 타입별 분포
        carrierDistribution:
          type: object
          additionalProperties:
            type: integer
          description: 통신사별 분포

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: integer
        details:
          type: object

security:
  - BearerAuth: []

paths:
  # 데이터 검색 및 미리보기
  /data/search:
    post:
      summary: 데이터 검색 및 미리보기
      description: 검색 조건에 따라 데이터를 검색하고 미리보기 정보를 제공합니다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataSearchFilter"
      responses:
        "200":
          description: 검색 결과 미리보기
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataPreview"
        "400":
          description: 잘못된 검색 조건
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /data:
    get:
      summary: 데이터 목록 조회
      description: 페이지네이션을 지원하는 데이터 목록 조회
      parameters:
        - name: dataType
          in: query
          schema:
            type: string
            enum: [VOICE, IMAGE, TEXT]
          description: 데이터 타입 필터
        - name: startDate
          in: query
          schema:
            type: string
            format: date-time
          description: 시작 날짜
        - name: endDate
          in: query
          schema:
            type: string
            format: date-time
          description: 종료 날짜
        - name: carrier
          in: query
          schema:
            type: string
            enum: [SKT, KT, LGU, MVNO]
          description: 통신사 필터
        - name: keyword
          in: query
          schema:
            type: string
          description: 내용 검색 키워드
        - name: page
          in: query
          schema:
            type: integer
            default: 0
          description: 페이지 번호
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
          description: 페이지 크기
        - name: sort
          in: query
          schema:
            type: string
            default: "timestamp,desc"
          description: "정렬 방식 (예: timestamp,desc)"
      responses:
        "200":
          description: 데이터 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: "#/components/schemas/VoicePhishingData"
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer
                  size:
                    type: integer
                  number:
                    type: integer
                  first:
                    type: boolean
                  last:
                    type: boolean

  /data/{dataId}:
    get:
      summary: 데이터 상세 조회
      parameters:
        - name: dataId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 데이터 상세 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoicePhishingData"
        "404":
          description: 데이터를 찾을 수 없음

  /data/{dataId}/download:
    get:
      summary: 데이터 파일 다운로드
      description: 특정 데이터의 원본 파일을 다운로드합니다
      parameters:
        - name: dataId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 파일 다운로드
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: 파일을 찾을 수 없음
        "403":
          description: 다운로드 권한 없음

  # 데이터셋 관리
  /datasets:
    get:
      summary: 데이터셋 목록 조회
      description: 사용자가 접근 가능한 데이터셋 목록을 조회합니다
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [CREATING, READY, EXPIRED, ERROR]
          description: 상태 필터
        - name: createdBy
          in: query
          schema:
            type: string
          description: 생성자 필터
        - name: search
          in: query
          schema:
            type: string
          description: 이름 또는 설명으로 검색
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: 데이터셋 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: "#/components/schemas/Dataset"
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer
                  size:
                    type: integer
                  number:
                    type: integer

    post:
      summary: 새 데이터셋 생성
      description: 검색 조건에 따라 새로운 데이터셋을 생성합니다
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetCreate"
      responses:
        "201":
          description: 데이터셋 생성 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "400":
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /datasets/{datasetId}:
    get:
      summary: 데이터셋 상세 조회
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 데이터셋 상세 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "404":
          description: 데이터셋을 찾을 수 없음
        "403":
          description: 접근 권한 없음

    put:
      summary: 데이터셋 수정
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetUpdate"
      responses:
        "200":
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "404":
          description: 데이터셋을 찾을 수 없음
        "403":
          description: 수정 권한 없음

    delete:
      summary: 데이터셋 삭제
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: 삭제 성공
        "404":
          description: 데이터셋을 찾을 수 없음
        "403":
          description: 삭제 권한 없음

  /datasets/{datasetId}/data:
    get:
      summary: 데이터셋 내 데이터 목록 조회
      description: 특정 데이터셋에 포함된 데이터 목록을 조회합니다
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
            default: json
          description: 응답 형식
      responses:
        "200":
          description: 데이터셋 내 데이터 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: "#/components/schemas/VoicePhishingData"
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer
            text/csv:
              schema:
                type: string
        "404":
          description: 데이터셋을 찾을 수 없음
        "403":
          description: 접근 권한 없음

  /datasets/{datasetId}/download:
    get:
      summary: 데이터셋 전체 다운로드
      description: 데이터셋에 포함된 모든 데이터를 압축파일로 다운로드합니다
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [zip, tar.gz]
            default: zip
          description: 압축 형식
        - name: includeMetadata
          in: query
          schema:
            type: boolean
            default: true
          description: 메타데이터 포함 여부
      responses:
        "200":
          description: 압축파일 다운로드
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: 데이터셋을 찾을 수 없음
        "403":
          description: 다운로드 권한 없음

  # 데이터셋 공유 관리
  /datasets/{datasetId}/share:
    post:
      summary: 데이터셋 공유 링크 생성
      description: 데이터셋에 대한 동적 공유 링크를 생성합니다
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expirationHours:
                  type: integer
                  minimum: 1
                  maximum: 8760
                  default: 24
                  description: 공유 링크 만료 시간 (시간)
                accessLimit:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  description: 접근 횟수 제한
                downloadLimit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: 다운로드 횟수 제한
                allowedIps:
                  type: array
                  items:
                    type: string
                  description: 허용 IP 주소 목록
                password:
                  type: string
                  minLength: 4
                  description: 접근 비밀번호 (선택사항)
      responses:
        "201":
          description: 공유 링크 생성 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetShare"
        "404":
          description: 데이터셋을 찾을 수 없음
        "403":
          description: 공유 권한 없음

    get:
      summary: 데이터셋 공유 링크 목록 조회
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 공유 링크 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DatasetShare"
        "404":
          description: 데이터셋을 찾을 수 없음
        "403":
          description: 조회 권한 없음

  /datasets/{datasetId}/share/{shareId}:
    get:
      summary: 특정 공유 링크 조회
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
        - name: shareId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 공유 링크 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetShare"
        "404":
          description: 공유 링크를 찾을 수 없음

    delete:
      summary: 공유 링크 삭제
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
        - name: shareId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: 삭제 성공
        "404":
          description: 공유 링크를 찾을 수 없음
        "403":
          description: 삭제 권한 없음

  # 동적 공유 경로 (토큰 기반 접근)
  /share/{shareToken}:
    get:
      summary: 공유 데이터셋 정보 조회
      description: 공유 토큰을 통해 데이터셋 정보를 조회합니다
      parameters:
        - name: shareToken
          in: path
          required: true
          schema:
            type: string
        - name: password
          in: query
          schema:
            type: string
          description: 접근 비밀번호 (설정된 경우)
      responses:
        "200":
          description: 공유 데이터셋 정보
          content:
            application/json:
              schema:
                type: object
                properties:
                  dataset:
                    $ref: "#/components/schemas/Dataset"
                  shareInfo:
                    type: object
                    properties:
                      accessCount:
                        type: integer
                      downloadCount:
                        type: integer
                      remainingAccess:
                        type: integer
                      remainingDownloads:
                        type: integer
                      expiresAt:
                        type: string
                        format: date-time
        "404":
          description: 공유 링크를 찾을 수 없거나 만료됨
        "401":
          description: 비밀번호가 틀림
        "403":
          description: 접근 제한 (IP, 횟수 등)

  /share/{shareToken}/data:
    get:
      summary: 공유 데이터셋 내 데이터 조회
      parameters:
        - name: shareToken
          in: path
          required: true
          schema:
            type: string
        - name: password
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        "200":
          description: 데이터 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: "#/components/schemas/VoicePhishingData"
                  totalElements:
                    type: integer
                  totalPages:
                    type: integer
            text/csv:
              schema:
                type: string
        "404":
          description: 공유 링크를 찾을 수 없음
        "401":
          description: 인증 실패
        "403":
          description: 접근 제한

  /share/{shareToken}/download:
    get:
      summary: 공유 데이터셋 다운로드
      parameters:
        - name: shareToken
          in: path
          required: true
          schema:
            type: string
        - name: password
          in: query
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [zip, tar.gz]
            default: zip
      responses:
        "200":
          description: 압축파일 다운로드
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: 공유 링크를 찾을 수 없음
        "401":
          description: 인증 실패
        "403":
          description: 다운로드 제한

  # 접근 제어 설정 (access-control.yml 연동)
  /datasets/{datasetId}/access-control:
    get:
      summary: 데이터셋 접근 제어 설정 조회
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 접근 제어 설정
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetAccessSettings"
        "404":
          description: 데이터셋을 찾을 수 없음
        "403":
          description: 조회 권한 없음

    put:
      summary: 데이터셋 접근 제어 설정 수정
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatasetAccessSettings"
      responses:
        "200":
          description: 설정 수정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetAccessSettings"
        "404":
          description: 데이터셋을 찾을 수 없음
        "403":
          description: 수정 권한 없음

  /datasets/{datasetId}/access-check:
    post:
      summary: 데이터셋 접근 권한 확인
      description: 특정 사용자의 데이터셋 접근 권한을 확인합니다
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: string
                  description: 확인할 사용자 ID
                action:
                  type: string
                  enum: [READ, download, share]
                  default: read
                  description: 확인할 작업
      responses:
        "200":
          description: 접근 권한 확인 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
                  reason:
                    type: string
                  restrictions:
                    type: object
                    properties:
                      remainingDownloads:
                        type: integer
                      remainingAccess:
                        type: integer
        "404":
          description: 데이터셋을 찾을 수 없음

  # 통계 및 모니터링
  /datasets/{datasetId}/statistics:
    get:
      summary: 데이터셋 이용 통계
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
        - name: period
          in: query
          schema:
            type: string
            enum: [day, week, month]
            default: week
      responses:
        "200":
          description: 이용 통계
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessCount:
                    type: integer
                  downloadCount:
                    type: integer
                  uniqueUsers:
                    type: integer
                  accessByDay:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                        accessCount:
                          type: integer
                        downloadCount:
                          type: integer
                  topUsers:
                    type: array
                    items:
                      type: object
                      properties:
                        userId:
                          type: string
                        username:
                          type: string
                        accessCount:
                          type: integer
                        downloadCount:
                          type: integer

  # 메타데이터 및 태그 관리
  /datasets/{datasetId}/tags:
    get:
      summary: 데이터셋 태그 조회
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 태그 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

    post:
      summary: 데이터셋 태그 추가
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tags
              properties:
                tags:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: 태그 추가 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

    delete:
      summary: 데이터셋 태그 삭제
      parameters:
        - name: datasetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tags
              properties:
                tags:
                  type: array
                  items:
                    type: string
      responses:
        "204":
          description: 태그 삭제 성공
