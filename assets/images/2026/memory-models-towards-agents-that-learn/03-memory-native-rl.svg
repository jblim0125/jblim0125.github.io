<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Standard RL and Memory-native RL</title>
  <desc id="desc">An original comparison of standard reinforcement learning with memory-native reinforcement learning for token-space memory formation.</desc>
  <rect width="1280" height="820" fill="#ffffff"/>
  <text x="86" y="86" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700" fill="#1f2937">Standard RL vs. memory-native RL</text>
  <text x="86" y="124" font-family="Inter, Arial, sans-serif" font-size="21" fill="#596579">The training target moves from one task outcome to memories that improve future tasks.</text>

  <rect x="86" y="178" width="1108" height="250" rx="22" fill="#f7f9fc" stroke="#d7dee8" stroke-width="2"/>
  <text x="126" y="230" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#253044">Standard RL</text>
  <rect x="150" y="284" width="190" height="78" rx="14" fill="#eaf1ff" stroke="#8db0ed" stroke-width="2"/>
  <text x="245" y="332" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#1f4a85">Task</text>
  <rect x="442" y="284" width="190" height="78" rx="14" fill="#fff2df" stroke="#e4aa53" stroke-width="2"/>
  <text x="537" y="332" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#7b510a">Agent Model</text>
  <rect x="734" y="284" width="190" height="78" rx="14" fill="#edf7ef" stroke="#80be8a" stroke-width="2"/>
  <text x="829" y="332" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#24623a">Outcome</text>
  <rect x="994" y="284" width="132" height="78" rx="14" fill="#f0edff" stroke="#a897ea" stroke-width="2"/>
  <text x="1060" y="332" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#51439a">Reward</text>
  <path d="M340 323 H430" stroke="#67768a" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M632 323 H722" stroke="#67768a" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M924 323 H982" stroke="#67768a" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <text x="537" y="390" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#596579">weight-space optimization for direct task performance</text>

  <rect x="86" y="486" width="1108" height="270" rx="22" fill="#fbfaf7" stroke="#d7dee8" stroke-width="2"/>
  <text x="126" y="538" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#253044">Memory-native RL</text>
  <rect x="150" y="604" width="160" height="78" rx="14" fill="#eaf1ff" stroke="#8db0ed" stroke-width="2"/>
  <text x="230" y="652" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#1f4a85">Task</text>
  <rect x="386" y="604" width="210" height="78" rx="14" fill="#edf7ef" stroke="#80be8a" stroke-width="2"/>
  <text x="491" y="652" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#24623a">Memory Harness</text>
  <rect x="672" y="604" width="190" height="78" rx="14" fill="#f0edff" stroke="#a897ea" stroke-width="2"/>
  <text x="767" y="652" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#51439a">Memory</text>
  <rect x="938" y="604" width="188" height="78" rx="14" fill="#fff2df" stroke="#e4aa53" stroke-width="2"/>
  <text x="1032" y="652" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" fill="#7b510a">Future Reward</text>
  <path d="M310 643 H374" stroke="#67768a" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M596 643 H660" stroke="#67768a" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M862 643 H926" stroke="#67768a" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M767 604 C728 548 565 548 514 596" stroke="#8b6fd7" stroke-width="4" fill="none" stroke-dasharray="10 10" marker-end="url(#arrowPurple)"/>
  <text x="640" y="722" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#596579">outer-loop training rewards memories that transfer across tasks and models</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#67768a"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#8b6fd7"/>
    </marker>
  </defs>
</svg>
